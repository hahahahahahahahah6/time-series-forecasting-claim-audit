[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-forecasting-claim-audit"
version = "0.1.0"
description = "Offline documentation and source audit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
time-series-forecasting-claim-audit = "time_series_forecasting_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["time_series_forecasting_claim_audit*", "tests"]
